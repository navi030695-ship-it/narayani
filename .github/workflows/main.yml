name: mypipeline

on:
  pull_request:
    branches: [ "develop", "main" ]

  push:
    branches: [ "develop", "main" ]


jobs:
  build:
    runs-on: myrunner

    steps:

    - name: code-checkout
      uses: actions/checkout@v2

    - name: package the application into artiface
      run: mvn clean package

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v8.4.0
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
