name: mypipeline

on:
  pull_request:
    branches: [ "develop", "main" ]

  push:
    branches: [ "develop", "main" ]


jobs:
  build:
    runs-on: myrunner

    steps:

    - name: code-checkout
      uses: actions/checkout@v2

    - name: package the application into artiface
      run: mvn clean package
